name: ci

# Быстрая проверка каждого пуша в main: правила ведущего должны оставаться
# зелёными, а приложение — собираться. Подпись здесь не нужна, это отладочный APK.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # На раннере GitHub 16 ГБ памяти — душить Gradle, как на самохостном
  # раннере Forgejo, больше не нужно.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-кэш
        uses: gradle/actions/setup-gradle@v4

      # Android SDK на раннере уже стоит ($ANDROID_HOME); дотягиваем только те
      # компоненты, которых может не быть в образе.
      - name: Android SDK — platform 35 и build-tools 35
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Тесты логики ведущего
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Отладочная сборка
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mafia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

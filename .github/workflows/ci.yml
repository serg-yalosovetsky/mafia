name: ci

# Быстрая проверка каждого пуша в main: правила ведущего должны оставаться
# зелёными, а приложение — собираться. Подпись здесь не нужна, это отладочный APK.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # На раннере GitHub 16 ГБ памяти — душить Gradle, как на самохостном
  # раннере Forgejo, больше не нужно.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-кэш
        uses: gradle/actions/setup-gradle@v6

      # Android SDK на раннере уже стоит ($ANDROID_HOME); дотягиваем только те
      # компоненты, которых может не быть в образе.
      - name: Android SDK — platform 35 и build-tools 35
        run: |
          set -eu
          # Без `ls | head` (SC2012): предпочитаем канонический latest, иначе
          # берём первый элемент отсортированного glob'а — оба пути без парсинга вывода ls.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            candidates=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
            SDKMANAGER="${candidates[0]}"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Тесты логики ведущего
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Отладочная сборка
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: mafia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

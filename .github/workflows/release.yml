name: release-apk

# Тег vX.Y.Z собирает подписанный релизный APK и кладёт его в релиз GitHub.
# Ручной запуск (workflow_dispatch) делает тот же APK, но версией 0.0.<run>-dev
# и без создания релиза — чтобы можно было проверить пайплайн, не плодя теги.
#
# Ключ подписи берётся из секретов ОКРУЖЕНИЯ `release`, а не из секретов
# репозитория (Settings → Environments → release → Environment secrets):
#   MAFIA_KEYSTORE_B64      — base64 файла mafia-release.jks
#   MAFIA_KEYSTORE_PASSWORD — пароль хранилища (он же пароль ключа)
#   MAFIA_KEY_ALIAS         — алиас ключа
#
# ВНИМАНИЕ, пока секреты заводить НЕЛЬЗЯ. На текущем тарифе (GitHub Free,
# приватный репозиторий) окружение принимает только политику ref'ов; required
# reviewers и wait timer отклоняются с HTTP 422 "billing plan", branch
# protection и rulesets — 403 "Upgrade to GitHub Pro or make this repository
# public". Значит держатель прав write может запустить этот workflow с
# собственного коммита и вытащить ключ подписи. Заводить MAFIA_* можно только
# после того, как появится required reviewer (GitHub Pro либо публичный репо),
# иначе ключ подписывается локально и в CI не кладётся вовсе.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    # Секреты ключа живут в этом окружении: джоб без него их не увидит, и
    # запуск с ref'а вне политики (не тег v* и не main) до них не доберётся.
    environment: release
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-кэш
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK — platform 35 и build-tools 35
        run: |
          set -eu
          # Без `ls | head` (SC2012): предпочитаем канонический latest, иначе
          # берём первый элемент отсортированного glob'а — оба пути без парсинга вывода ls.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            candidates=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
            SDKMANAGER="${candidates[0]}"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Релизный ключ из секретов
        run: |
          set -eu
          echo "${{ secrets.MAFIA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mafia-release.jks"
          test -s "$RUNNER_TEMP/mafia-release.jks"
          echo "MAFIA_KEYSTORE_FILE=$RUNNER_TEMP/mafia-release.jks" >> "$GITHUB_ENV"

      - name: Версия сборки
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${{ github.run_number }}-dev"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Собираем версию $VERSION (versionCode ${{ github.run_number }})"

      - name: Тесты логики ведущего
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка подписанного APK
        env:
          MAFIA_KEYSTORE_PASSWORD: ${{ secrets.MAFIA_KEYSTORE_PASSWORD }}
          MAFIA_KEY_ALIAS: ${{ secrets.MAFIA_KEY_ALIAS }}
          MAFIA_KEY_PASSWORD: ${{ secrets.MAFIA_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$APP_VERSION" -PversionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mafia-$APP_VERSION.apk"
          ls -la out

      - name: Проверить, что APK подписан релизным ключом
        run: |
          set -eu
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "out/mafia-$APP_VERSION.apk" | tee signer.txt
          grep -q "CN=Serhii Yalosovetskyi" signer.txt

      - name: Релиз в GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BODY=$(printf 'Мафия %s — приложение-ведущий.\n\nПодписано релизным ключом, собрано из %s.\nAPK ниже: скачать и установить на телефон.' "$APP_VERSION" "$GITHUB_SHA")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Мафия $APP_VERSION" \
            --notes "$BODY" \
            "out/mafia-$APP_VERSION.apk"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "asset: \(.url)"'

      - uses: actions/upload-artifact@v7
        with:
          name: mafia-apk
          path: out/*.apk
          if-no-files-found: error

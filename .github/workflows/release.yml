name: release-apk

# Тег vX.Y.Z собирает подписанный релизный APK и кладёт его в релиз Forgejo.
# Ручной запуск (workflow_dispatch) делает тот же APK, но версией 0.0.<run>-dev
# и без создания релиза — чтобы можно было проверить пайплайн, не плодя теги.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /opt/android-sdk
  # Раннер режет джоб по 3 ГБ памяти: демон Gradle и второй процесс компилятора
  # туда не помещаются, поэтому собираем в один процесс.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1536m -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 и утилиты
        run: |
          set -eu
          if ! command -v javac >/dev/null || ! javac -version 2>&1 | grep -q '^javac 17'; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless
          fi
          command -v unzip >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
          javac -version

      - name: Android SDK
        run: |
          set -eu
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && rm tools.zip && mv cmdline-tools latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

      - name: Релизный ключ из секретов
        run: |
          set -eu
          echo "${{ secrets.MAFIA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mafia-release.jks"
          test -s "$RUNNER_TEMP/mafia-release.jks"
          echo "MAFIA_KEYSTORE_FILE=$RUNNER_TEMP/mafia-release.jks" >> "$GITHUB_ENV"

      - name: Версия сборки
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${{ github.run_number }}-dev"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Собираем версию $VERSION (versionCode ${{ github.run_number }})"

      - name: Тесты логики ведущего
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка подписанного APK
        env:
          MAFIA_KEYSTORE_PASSWORD: ${{ secrets.MAFIA_KEYSTORE_PASSWORD }}
          MAFIA_KEY_ALIAS: ${{ secrets.MAFIA_KEY_ALIAS }}
          MAFIA_KEY_PASSWORD: ${{ secrets.MAFIA_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$APP_VERSION" -PversionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mafia-$APP_VERSION.apk"
          ls -la out

      - name: Проверить, что APK подписан релизным ключом
        run: |
          set -eu
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "out/mafia-$APP_VERSION.apk" | tee signer.txt
          grep -q "CN=Serhii Yalosovetskyi" signer.txt

      - uses: actions/upload-artifact@v3
        with:
          name: mafia-apk
          path: out/*.apk

      - name: Релиз в Forgejo
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.MAFIA_FORGEJO_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          BODY=$(printf 'Мафия %s — приложение-ведущий.\n\nПодписано релизным ключом, собрано из %s.\nAPK ниже: скачать и установить на телефон.' "$APP_VERSION" "$GITHUB_SHA")
          RELEASE_ID=$(curl -sS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os,sys; print(json.dumps({"tag_name": os.environ["GITHUB_REF_NAME"], "name": "Мафия " + os.environ["APP_VERSION"], "body": sys.argv[1]}))' "$BODY")" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sS -X POST "$API/releases/$RELEASE_ID/assets?name=mafia-$APP_VERSION.apk" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@out/mafia-$APP_VERSION.apk" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("asset:", d["browser_download_url"])'
